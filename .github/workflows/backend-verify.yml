name: Verify key chain backend

on:
  push:
    branches: [codex/verify-user-key-routing]

permissions:
  contents: read

concurrency:
  group: key-chain-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    container: rust:1.99.0-slim-bookworm
    timeout-minutes: 120
    env:
      DEBIAN_FRONTEND: noninteractive
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_TARGET_DIR: /tmp/key-chain-target
      RUST_MIN_STACK: 67108864
      RUSTFLAGS: -C link-arg=-fuse-ld=bfd
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Bookworm dependencies
        run: |
          set -euo pipefail
          apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
          apt-get install -y --no-install-recommends \
            ca-certificates curl git pkg-config build-essential libssl-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            perl cmake clang libclang-dev python3 binutils

      - name: Checkout exact pushed revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go for BoringSSL
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.4
          cache: false

      - name: Prepare external-frontend backend build
        run: |
          set -euo pipefail
          mkdir -p dist artifact logs
          test ! -e "$CARGO_TARGET_DIR"
          if [ ! -e dist/index.html ]; then
            printf '<!doctype html><title>Headless backend build</title>\n' > dist/index.html
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse HEAD > artifact/source-revision.txt
          git diff --exit-code
          rustc --version
          cargo --version
          go version
          getconf GNU_LIBC_VERSION

      # Test with the release profile so native/Rust dependency compilation is
      # reusable by the binary build and no local target metadata is involved.
      - name: Compile targeted library regression tests
        working-directory: src-tauri
        run: |
          set -euo pipefail
          cargo test --locked --release --no-default-features --lib --no-run --message-format=json \
            > ../logs/build.json 2> >(tee ../logs/test-build.stderr.log >&2)
          python3 - <<'PY'
          import json
          from pathlib import Path
          candidates = []
          for line in Path('../logs/build.json').read_text().splitlines():
              item = json.loads(line)
              if (item.get('reason') == 'compiler-artifact'
                  and item.get('target', {}).get('name') == 'antigravity_tools_lib'
                  and item.get('profile', {}).get('test')
                  and item.get('executable')):
                  candidates.append(item['executable'])
          assert len(candidates) == 1, f'Expected one library test executable, got {len(candidates)}'
          assert Path(candidates[0]).is_file(), 'Test executable missing'
          Path('../logs/test-executable.txt').write_text(candidates[0] + '\n')
          PY
          test_binary=$(cat ../logs/test-executable.txt)
          "$test_binary" --list > ../logs/test-list.txt

      - name: Run key and routing regression tests
        working-directory: src-tauri
        run: |
          set -euo pipefail
          filters=(
            'proxy::middleware::auth::tests::'
            'proxy::handlers::thinking::tests::'
            'compaction_gate_is_isolated'
            'compaction_summary_keeps'
            'tenant_isolation_and_end_session'
            'test_3d_orthogonal_blended_session'
            'proxy::http_session_store::tests::'
            'proxy::handlers::openai::stream_peek_tests::'
            'responses_parent_history_reads_signature_from_the_tenant_store_key'
            'proxy::mappers::openai::streaming::tests::'
            'fallback_error_preserves_provider_error'
            'fallback_diagnosis_keeps'
            'bare_flash'
            'account_tier_'
          )
          printf '%s\n' "${filters[@]}" > ../logs/test-filters.txt
          test_binary=$(cat ../logs/test-executable.txt)
          for filter in "${filters[@]}"; do
            grep -F "$filter" ../logs/test-list.txt > /dev/null
            printf '\nFilter: %s\n' "$filter" | tee -a ../logs/targeted-tests.log
            "$test_binary" "$filter" --test-threads=1 2>&1 | tee -a ../logs/targeted-tests.log
          done

      - name: Build release backend
        working-directory: src-tauri
        run: |
          set -euo pipefail
          cargo rustc --locked --release --no-default-features --bin antigravity-tools -- -C lto=off \
            2>&1 | tee ../logs/release-build.log
          cp "$CARGO_TARGET_DIR/release/antigravity-tools" ../artifact/antigravity-tools

      - name: Record provenance and ABI requirements
        run: |
          set -euo pipefail
          /lib64/ld-linux-x86-64.so.2 --verify artifact/antigravity-tools
          /lib64/ld-linux-x86-64.so.2 --list artifact/antigravity-tools > artifact/loader-libraries.txt
          readelf --version-info artifact/antigravity-tools > artifact/elf-versions.txt
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          def output(args):
              return subprocess.check_output(args, text=True).strip()
          metadata = {
              'source_revision': output(['git', 'rev-parse', 'HEAD']),
              'source_tree_dirty': bool(output(['git', 'status', '--porcelain', '--untracked-files=no'])),
              'build_profile': 'release',
              'default_features': False,
              'verified_test_filters': Path('logs/test-filters.txt').read_text().splitlines(),
              'rustc_version': output(['rustc', '--version']),
              'go_version': output(['go', 'version']),
              'libc_version': output(['getconf', 'GNU_LIBC_VERSION']),
              'container': 'rust:1.99.0-slim-bookworm',
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'frontend': 'External production assets required; embedded placeholder only',
          }
          assert not metadata['source_tree_dirty'], 'Tracked source changed during the build'
          Path('artifact/build-info.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PY
          cd artifact
          sha256sum antigravity-tools > SHA256SUMS

      - name: Upload verified backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: key-chain-backend-bookworm-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload test and build logs on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: key-chain-test-logs-${{ github.sha }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
